name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A tag push and a release for the same tag can both start a run. Run them one after the other.
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      artifact: ${{ steps.version.outputs.artifact }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version from tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          case "$EVENT_NAME" in
            release) tag="$RELEASE_TAG" ;;
            push) tag="$REF_NAME" ;;
            *) tag="" ;;
          esac
          if [ -n "$tag" ]; then
            version="${tag#v}"
            echo "XUMMARY_VERSION=$version" >> "$GITHUB_ENV"
            # xummary --version reads the Cargo version, so it follows the tag too.
            perl -i -pe 's/^version = "[^"]*"/version = "'"$version"'"/ if $. < 5' cli/Cargo.toml
            echo "artifact=xummary-$tag" >> "$GITHUB_OUTPUT"
          else
            echo "artifact=xummary-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # One self-signed certificate for every release keeps one identity, so macOS keeps
      # the Keychain access it granted to xummary after an update. See scripts/make-signing-cert.sh.
      - name: Import the signing certificate
        env:
          P12_BASE64: ${{ secrets.XUMMARY_CERT_P12_BASE64 }}
          PASSWORD: ${{ secrets.XUMMARY_CERT_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] || [ -z "$PASSWORD" ]; then
            echo "XUMMARY_SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            echo "::warning::The signing secrets are not set. This build is signed ad hoc."
            {
              echo "> [!WARNING]"
              echo "> \`XUMMARY_CERT_P12_BASE64\` and \`XUMMARY_CERT_PASSWORD\` are not set, so this build is signed ad hoc."
              echo "> macOS will ask again for Keychain access after installing it."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          p12="$RUNNER_TEMP/signing.p12"
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo "$P12_BASE64" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # LibreSSL wrote the .p12, and Homebrew's OpenSSL 3 cannot read its RC2 encryption.
          fingerprint="$(/usr/bin/openssl pkcs12 -in "$p12" -nokeys -passin env:PASSWORD \
            | /usr/bin/openssl x509 -noout -fingerprint -sha1 | sed 's/.*=//; s/://g')"
          rm -f "$p12"
          echo "XUMMARY_SIGN_IDENTITY=$fingerprint" >> "$GITHUB_ENV"
          echo "Signed with the xummary certificate \`$fingerprint\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Test and build the CLI
        working-directory: cli
        run: |
          cargo --version
          cargo test
          cargo build --release
          codesign --force --sign "$XUMMARY_SIGN_IDENTITY" --identifier com.kernoeb.xummary.cli \
            --timestamp=none target/release/xummary
          target/release/xummary --version

      - name: Test and build the app
        working-directory: macos
        env:
          XUMMARY_BIN: ${{ github.workspace }}/cli/target/release/xummary
        run: |
          swift --version
          ./tools/test.sh
          ./build.sh
          codesign --verify --deep --strict Xummary.app

      # The names carry no version, so install.sh can fetch releases/latest/download/<name>.
      # ditto keeps the bundle's signature and attributes, which a plain zip loses.
      - name: Package
        run: |
          mkdir dist
          ditto -c -k --keepParent macos/Xummary.app dist/Xummary-macos-arm64.zip
          tar -czf dist/xummary-cli-macos-arm64.tar.gz -C cli/target/release xummary
          (cd dist && shasum -a 256 * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: dist

      - name: Attach the app, the CLI and the checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --generate-notes --title "$TAG"
          fi
          gh release upload "$TAG" dist/* --clobber
